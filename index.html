<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Food Delivery Pro</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#f4f4f4;
transition:0.3s;
}

.dark{
background:#111;
color:#fff;
}

header{
background:#ff5722;
color:#fff;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

header h1{
font-size:28px;
}

nav button{
padding:8px 15px;
border:none;
background:#fff;
color:#ff5722;
font-weight:bold;
border-radius:5px;
cursor:pointer;
margin-left:10px;
}

.hero{
padding:40px;
text-align:center;
background:linear-gradient(135deg,#ff5722,#ff9800);
color:#fff;
font-size:32px;
font-weight:bold;
}

.search{
text-align:center;
padding:20px;
}

.search input{
padding:12px;
width:300px;
border:none;
border-radius:5px;
}

.search button{
padding:12px 18px;
border:none;
background:#ff5722;
color:#fff;
border-radius:5px;
cursor:pointer;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#fff;
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
transition:0.3s;
}

.dark .card{
background:#222;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.content{
padding:15px;
}

.price{
color:#ff5722;
font-size:20px;
font-weight:bold;
margin:10px 0;
}

.card button{
width:100%;
padding:10px;
border:none;
background:#ff5722;
color:#fff;
font-size:16px;
cursor:pointer;
border-radius:5px;
}

.cart{
background:#fff;
margin:20px;
padding:20px;
border-radius:10px;
}

.dark .cart{
background:#222;
}

.cart li{
margin:10px 0;
display:flex;
justify-content:space-between;
}

.remove{
background:red;
color:#fff;
border:none;
padding:5px 10px;
cursor:pointer;
border-radius:5px;
}

.checkout{
margin-top:15px;
padding:12px;
width:100%;
border:none;
background:green;
color:#fff;
font-size:18px;
cursor:pointer;
border-radius:5px;
}

.tracking{
text-align:center;
padding:20px;
font-size:20px;
font-weight:bold;
color:green;
}

footer{
background:#222;
color:#fff;
text-align:center;
padding:15px;
margin-top:30px;
}
</style>
</head>

<body>

<header>
<h1>FoodExpress Pro</h1>
<nav>
<button onclick="toggleDark()">🌙 Mode</button>
</nav>
</header>

<div class="hero">
Order Delicious Food Instantly 🍔🍕
</div>

<div class="search">
<input type="text" id="searchInput" placeholder="Search food...">
<button onclick="searchFood()">Search</button>
</div>

<div class="container" id="foods">

<div class="card">
<img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38">
<div class="content">
<h3>Pizza</h3>
<div class="price">₹299</div>
<button onclick="addToCart('Pizza',299)">Add To Cart</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1550547660-d9450f859349">
<div class="content">
<h3>Burger</h3>
<div class="price">₹199</div>
<button onclick="addToCart('Burger',199)">Add To Cart</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092">
<div class="content">
<h3>Biryani</h3>
<div class="price">₹349</div>
<button onclick="addToCart('Biryani',349)">Add To Cart</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1604908176997-125f25cc6f3d">
<div class="content">
<h3>Pasta</h3>
<div class="price">₹249</div>
<button onclick="addToCart('Pasta',249)">Add To Cart</button>
</div>
</div>

</div>

<div class="cart">
<h2>🛒 Cart</h2>
<ul id="cartItems"></ul>
<h3>Total ₹<span id="total">0</span></h3>
<button class="checkout" onclick="checkout()">Checkout</button>
</div>

<div class="tracking" id="track"></div>

<footer>
© 2026 FoodExpress Pro
</footer>

<script>
let total=0;

function addToCart(item,price){
let li=document.createElement("li");
li.innerHTML=item+" - ₹"+price+" <button class='remove' onclick='removeItem(this,"+price+")'>X</button>";
document.getElementById("cartItems").appendChild(li);

total+=price;
document.getElementById("total").innerText=total;
}

function removeItem(btn,price){
btn.parentElement.remove();
total-=price;
document.getElementById("total").innerText=total;
}

function searchFood(){
let input=document.getElementById("searchInput").value.toLowerCase();
let cards=document.querySelectorAll(".card");

cards.forEach(card=>{
let title=card.querySelector("h3").innerText.toLowerCase();

if(title.includes(input)){
card.style.display="block";
}else{
card.style.display="none";
}
});
}

function toggleDark(){
document.body.classList.toggle("dark");
}

function checkout(){
if(total==0){
alert("Cart Empty");
return;
}

alert("Order Placed Successfully!");

let track=document.getElementById("track");
track.innerHTML="🚴 Your order is on the way...";

setTimeout(()=>{
track.innerHTML="✅ Delivered Successfully!";
},5000);
}
</script>

</body>
</html>
<!-- Payment Gateway Popup -->
<div id="paymentBox" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
justify-content:center;
align-items:center;
z-index:999;
">

<div style="
background:#fff;
padding:25px;
width:350px;
border-radius:12px;
text-align:center;
">

<h2>💳 Secure Payment</h2>

<input type="text" id="cardName" placeholder="Card Holder Name"
style="width:100%;padding:10px;margin:8px 0;">

<input type="text" id="cardNumber" placeholder="Card Number"
style="width:100%;padding:10px;margin:8px 0;">

<input type="text" id="expiry" placeholder="MM/YY"
style="width:48%;padding:10px;margin:8px 1%;">

<input type="text" id="cvv" placeholder="CVV"
style="width:48%;padding:10px;margin:8px 1%;">

<h3>Total ₹<span id="payAmount">0</span></h3>

<button onclick="payNow()" style="
width:100%;
padding:12px;
background:green;
color:white;
border:none;
margin-top:10px;
cursor:pointer;
border-radius:6px;
">Pay Now</button>

<button onclick="closePay()" style="
width:100%;
padding:10px;
background:red;
color:white;
border:none;
margin-top:10px;
cursor:pointer;
border-radius:6px;
">Cancel</button>

</div>
</div>
